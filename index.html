<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>郑良的个人主页</title>
  <style>
    body {
      font-family: Arial, "Microsoft YaHei", sans-serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 60px 20px;
      line-height: 1.8;
      color: #222;
    }
    h1 {
      color: #1f4e79;
    }
    .card {
      background: #f7f9fc;
      padding: 24px;
      border-radius: 12px;
      margin-top: 24px;
    }
  </style>
</head>
<body>
  <h1>郑良</h1>
  <p>欢迎来到我的个人主页。</p>

  <div class="card">
    <h2>个人简介</h2>
    <p>这里可以填写你的教育背景、研究方向、项目经历或个人介绍。</p>
  </div>

  <div class="card">
    <h2>研究方向</h2>
    <p>智能制造、人工智能、计算机视觉、工业大数据等。</p>
  </div>

  <div class="card">
    <h2>联系方式</h2>
    <p>Email: yourname@example.com</p>
    <p>GitHub: https://github.com/你的用户名</p>
  </div>
</body>
</html>
